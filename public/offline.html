<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Website RT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f0fdf4; color: #1e293b;
      text-align: center; padding: 2rem;
    }
    .card {
      background: white; border-radius: 1rem; padding: 3rem 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 400px;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #059669; }
    p { color: #64748b; margin-bottom: 1.5rem; line-height: 1.6; }
    button {
      background: #059669; color: white; border: none; padding: 0.75rem 2rem;
      border-radius: 0.5rem; font-size: 1rem; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sedang Offline</h1>
    <p>Tidak ada koneksi internet. Silakan periksa jaringan Anda dan coba lagi.</p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
